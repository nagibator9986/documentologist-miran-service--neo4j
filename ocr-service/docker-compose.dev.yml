version: "3.9"

# ──────────────────────────────────────────────────────────────
# Development / CPU-only override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ──────────────────────────────────────────────────────────────

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    deploy: {}   # removes GPU reservation
    environment:
      DATABASE_URL: "postgresql+asyncpg://docolog:docolog_secret@postgres:5432/documentolog"
      DATABASE_URL_SYNC: "postgresql://docolog:docolog_secret@postgres:5432/documentolog"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "false"
      PREFECT_API_URL: "http://prefect-server:4200/api"
      OCR_CONCURRENCY_LIMIT: "1"
      # Force CPU mode for PyTorch
      CUDA_VISIBLE_DEVICES: ""
